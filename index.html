<style>

<script>
'use strict';

// ── 🎵 TAYLOR SWIFT-STYLE BACKGROUND MUSIC ────────────────────
var _ac=null,_musicStarted=false,_gameMusic=false;
var _introGain=null,_gameGain=null;
var _introLoop=false,_gameLoop=false;
function _AC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}

function startTSMusic(){
  if(_musicStarted)return;_musicStarted=true;
  var ac=_AC();
  var master=ac.createGain();master.gain.value=0.20;master.connect(ac.destination);

  // Short reverb (country room sound)
  var rev=ac.createConvolver();
  var rl=ac.sampleRate*1.4,rb=ac.createBuffer(2,rl,ac.sampleRate);
  for(var rc=0;rc<2;rc++){var rd=rb.getChannelData(rc);for(var ri=0;ri<rl;ri++)rd[ri]=(Math.random()*2-1)*Math.pow(1-ri/rl,3.2);}
  rev.buffer=rb;var rg=ac.createGain();rg.gain.value=0.22;rev.connect(rg);rg.connect(master);

  // G major I-V-vi-IV: G - D - Em - C  (BPM 120)
  var BPM=120,beat=60/BPM,bar=beat*4;
  // [root, maj3, perf5]
  var CHORDS=[
    [392.00,493.88,587.33], // G
    [293.66,369.99,440.00], // D
    [329.63,392.00,493.88], // Em
    [261.63,329.63,392.00]  // C
  ];
  var ROOTS=[98.00,73.42,82.41,65.41]; // G2 D2 E2 C2 bass

  // ── Banjo-style pluck (short triangle decay) ──────────────
  function banjo(fr,t,vol){
    var o=ac.createOscillator(),gn=ac.createGain(),f2=ac.createBiquadFilter();
    o.type='triangle';o.frequency.value=fr;
    f2.type='peaking';f2.frequency.value=1800;f2.gain.value=6;
    gn.gain.setValueAtTime(vol||0.09,t);
    gn.gain.exponentialRampToValueAtTime(0.001,t+beat*0.38);
    o.connect(f2);f2.connect(gn);gn.connect(rev);gn.connect(master);
    o.start(t);o.stop(t+beat*0.4);
  }

  // ── Guitar strum chord (multi-note staggered) ─────────────
  function strum(freqs,t,dur){
    freqs.forEach(function(fr,i){
      var o=ac.createOscillator(),gn=ac.createGain(),f2=ac.createBiquadFilter();
      o.type='sawtooth';o.frequency.value=fr;
      f2.type='lowpass';f2.frequency.value=2200;f2.Q.value=1.2;
      var st=t+i*0.014;
      gn.gain.setValueAtTime(0,st);
      gn.gain.linearRampToValueAtTime(0.04,st+0.05);
      gn.gain.exponentialRampToValueAtTime(0.001,st+dur*0.7);
      o.connect(f2);f2.connect(gn);gn.connect(rev);gn.connect(master);
      o.start(st);o.stop(st+dur*0.75);
    });
  }

  // ── Fiddle-style melody (original ascending G major motif) ─
  // Original melodic phrase in G major (not reproducing any copyrighted melody)
  var FIDDLE=[
    // bar 1 (G): rise then rest
    [0,392],[0.25,440],[0.5,493.88],[0.75,587.33],
    [1,523.25],[1.25,493.88],[1.5,440],[1.75,0],
    // bar 2 (D): resolve down
    [2,493.88],[2.25,440],[2.5,392],[2.75,369.99],
    [3,392],[3.25,329.63],[3.5,0],[3.75,0],
    // bar 3 (Em): minor colour
    [4,329.63],[4.25,392],[4.5,440],[4.75,493.88],
    [5,523.25],[5.25,493.88],[5.5,440],[5.75,0],
    // bar 4 (C): cadence
    [6,523.25],[6.25,493.88],[6.5,440],[6.75,392],
    [7,349.23],[7.25,329.63],[7.5,261.63],[7.75,0]
  ];
  function fiddle(startT){
    FIDDLE.forEach(function(n){
      if(!n[1])return;
      var o=ac.createOscillator(),gn=ac.createGain(),vib=ac.createOscillator(),vibG=ac.createGain();
      o.type='sawtooth';o.frequency.value=n[1];
      // Vibrato
      vib.type='sine';vib.frequency.value=5.5;vibG.gain.value=3;
      vib.connect(vibG);vibG.connect(o.frequency);
      var nt=startT+n[0]*beat;
      gn.gain.setValueAtTime(0,nt);gn.gain.linearRampToValueAtTime(0.065,nt+0.03);
      gn.gain.exponentialRampToValueAtTime(0.001,nt+beat*0.22);
      o.connect(gn);gn.connect(rev);gn.connect(master);
      o.start(nt);o.stop(nt+beat*0.25);vib.start(nt);vib.stop(nt+beat*0.25);
    });
  }

  // ── Bass (root notes, country thump) ──────────────────────
  function bass(fr,t,dur){
    var o=ac.createOscillator(),gn=ac.createGain(),f2=ac.createBiquadFilter();
    o.type='triangle';o.frequency.value=fr;
    f2.type='lowpass';f2.frequency.value=200;
    gn.gain.setValueAtTime(0.18,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur*0.85);
    o.connect(f2);f2.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur);
  }

  // ── Kick drum ─────────────────────────────────────────────
  function kick(t){
    var o=ac.createOscillator(),gn=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(38,t+0.09);
    gn.gain.setValueAtTime(0.55,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.2);
  }
  // ── Snare (country snappy) ────────────────────────────────
  function snare(t){
    var nb=ac.createBuffer(1,Math.ceil(ac.sampleRate*.14),ac.sampleRate);
    var nd=nb.getChannelData(0);for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var src=ac.createBufferSource(),sf=ac.createBiquadFilter(),sg=ac.createGain();
    src.buffer=nb;sf.type='bandpass';sf.frequency.value=1400;sf.Q.value=0.6;
    sg.gain.setValueAtTime(0.28,t);sg.gain.exponentialRampToValueAtTime(0.001,t+0.13);
    src.connect(sf);sf.connect(sg);sg.connect(master);src.start(t);
    // Tone body
    var o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.value=190;
    og.gain.setValueAtTime(0.12,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(og);og.connect(master);o.start(t);o.stop(t+0.07);
  }
  // ── Hi-hat (8th-note country shuffle) ────────────────────
  function hat(t,v){
    var nb=ac.createBuffer(1,Math.ceil(ac.sampleRate*.055),ac.sampleRate);
    var nd=nb.getChannelData(0);for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var src=ac.createBufferSource(),hf=ac.createBiquadFilter(),hg=ac.createGain();
    src.buffer=nb;hf.type='highpass';hf.frequency.value=7000;
    hg.gain.setValueAtTime(v||0.06,t);hg.gain.exponentialRampToValueAtTime(0.001,t+0.055);
    src.connect(hf);hf.connect(hg);hg.connect(master);src.start(t);
  }

  // ── 8-bar loop scheduler ──────────────────────────────────
  var LOOP_BARS=8;var loopLen=bar*LOOP_BARS;
  function scheduleLoop(offset){
    var t=ac.currentTime+0.05+offset;
    for(var bi=0;bi<LOOP_BARS;bi++){
      var ch=CHORDS[bi%4];
      // Strum on beat 1 and 3 of each bar
      strum(ch,t+bi*bar,beat*1.8);
      strum(ch,t+bi*bar+beat*2,beat*1.8);
      // Banjo pluck fills on off-beats
      banjo(ch[0]*2,t+bi*bar+beat*0.5,0.06);
      banjo(ch[1]*2,t+bi*bar+beat*1.5,0.05);
      banjo(ch[2]*2,t+bi*bar+beat*2.5,0.06);
      banjo(ch[0]*2,t+bi*bar+beat*3.5,0.05);
      // Bass root on 1 and 3
      bass(ROOTS[bi%4],t+bi*bar,beat);
      bass(ROOTS[bi%4]*1.33,t+bi*bar+beat*2,beat);
      // Drums: kick 1&3, snare 2&4
      for(var b2=0;b2<4;b2++){
        var bt=t+bi*bar+b2*beat;
        if(b2===0||b2===2)kick(bt);else snare(bt);
        hat(bt,0.05);hat(bt+beat*.5,0.035);
      }
    }
    // Fiddle runs bars 0-7 (two 4-bar phrases)
    fiddle(t);fiddle(t+bar*4);
    setTimeout(function(){scheduleLoop(loopLen-0.1);},Math.max(0,(loopLen-0.25)*1000));
  }
  scheduleLoop(0);
}

// ── K-POP GIRL GROUP STYLE GAMEPLAY TRACK (original composition) ──
function startGameMusic(){
  if(_gameMusic)return;_gameMusic=true;
  var ac=_AC();
  var master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
  _gameGain=master;_gameLoop=true;
  // Fade in
  master.gain.setTargetAtTime(0.22,ac.currentTime,0.4);

  // Bright room + shimmer reverb
  var rev=ac.createConvolver();
  var rl=ac.sampleRate*1.2,rb=ac.createBuffer(2,rl,ac.sampleRate);
  for(var rc=0;rc<2;rc++){var rd=rb.getChannelData(rc);for(var ri=0;ri<rl;ri++)rd[ri]=(Math.random()*2-1)*Math.pow(1-ri/rl,2.8);}
  rev.buffer=rb;var rg=ac.createGain();rg.gain.value=0.28;rev.connect(rg);rg.connect(master);

  // A major I-vi-IV-V: A F#m D E  @ 128 BPM — bright, upbeat K-pop feel
  var BPM2=128,bt2=60/BPM2,br2=bt2*4;
  var CH2=[
    [440,554.37,659.26,880],   // A  major
    [369.99,440,554.37,739.99],// F#m
    [293.66,369.99,440,587.33],// D  major
    [329.63,415.30,493.88,659.26]// E major
  ];
  var BASS2=[110,92.50,73.42,82.41];// A2 F#2 D2 E2

  // ── Synth pad (lush layered detune) ──────────────────────────────
  function pad(freqs,t,dur){
    freqs.forEach(function(fr){
      var o=ac.createOscillator(),o2=ac.createOscillator();
      var gn=ac.createGain(),lp=ac.createBiquadFilter();
      o.type='sawtooth';o.frequency.value=fr;
      o2.type='sawtooth';o2.frequency.value=fr*1.006;// 6¢ detune
      var mg=ac.createGain();mg.gain.value=0.5;o2.connect(mg);mg.connect(lp);
      lp.type='lowpass';lp.frequency.value=3600;
      o.connect(lp);lp.connect(gn);
      gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(0.028,t+0.08);
      gn.gain.exponentialRampToValueAtTime(0.001,t+dur*0.92);
      gn.connect(rev);gn.connect(master);
      o.start(t);o.stop(t+dur);o2.start(t);o2.stop(t+dur);
    });
  }

  // ── Sparkly arpeggio (16th-note pluck synth) ─────────────────────
  function arp(freqs,t){
    var pattern=[0,2,1,3,0,2,3,1,0,2,1,3,2,0,3,1];// index shuffles
    pattern.forEach(function(pi,i){
      var fr=freqs[pi%freqs.length];
      var o=ac.createOscillator(),gn=ac.createGain(),hp=ac.createBiquadFilter();
      o.type='triangle';o.frequency.value=fr*2;
      hp.type='highpass';hp.frequency.value=800;
      var nt=t+i*bt2*0.25;
      gn.gain.setValueAtTime(0.06,nt);gn.gain.exponentialRampToValueAtTime(0.001,nt+bt2*0.22);
      o.connect(hp);hp.connect(gn);gn.connect(rev);gn.connect(master);
      o.start(nt);o.stop(nt+bt2*0.26);
    });
  }

  // ── Synth bass (punchy sub) ───────────────────────────────────────
  function bass2(fr,t){
    var o=ac.createOscillator(),gn=ac.createGain(),lp=ac.createBiquadFilter();
    o.type='square';o.frequency.value=fr;
    lp.type='lowpass';lp.frequency.value=280;lp.Q.value=2;
    gn.gain.setValueAtTime(0.28,t);gn.gain.exponentialRampToValueAtTime(0.001,t+bt2*0.88);
    o.connect(lp);lp.connect(gn);gn.connect(master);o.start(t);o.stop(t+bt2);
    // Bass walk on beat 3
    var o2=ac.createOscillator(),g2=ac.createGain(),lp2=ac.createBiquadFilter();
    o2.type='square';o2.frequency.value=fr*1.25;
    lp2.type='lowpass';lp2.frequency.value=280;
    g2.gain.setValueAtTime(0.20,t+bt2*2);g2.gain.exponentialRampToValueAtTime(0.001,t+bt2*2.85);
    o2.connect(lp2);lp2.connect(g2);g2.connect(master);o2.start(t+bt2*2);o2.stop(t+bt2*3);
  }

  // ── Four-on-the-floor kick ────────────────────────────────────────
  function kick2(t){
    var o=ac.createOscillator(),gn=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(40,t+0.06);
    gn.gain.setValueAtTime(0.8,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.14);
    o.connect(gn);gn.connect(master);o.start(t);o.stop(t+0.15);
  }
  // ── Clap (bright K-pop snap) ──────────────────────────────────────
  function clap2(t){
    var nb=ac.createBuffer(1,Math.ceil(ac.sampleRate*.09),ac.sampleRate);
    var nd=nb.getChannelData(0);for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var src=ac.createBufferSource(),bp=ac.createBiquadFilter(),sg=ac.createGain();
    src.buffer=nb;bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=0.7;
    sg.gain.setValueAtTime(0.40,t);sg.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    src.connect(bp);bp.connect(sg);sg.connect(master);src.start(t);
  }
  // ── Open hi-hat shimmer ───────────────────────────────────────────
  function hat2(t,v){
    var nb=ac.createBuffer(1,Math.ceil(ac.sampleRate*.05),ac.sampleRate);
    var nd=nb.getChannelData(0);for(var i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    var src=ac.createBufferSource(),hp=ac.createBiquadFilter(),hg=ac.createGain();
    src.buffer=nb;hp.type='highpass';hp.frequency.value=9000;
    hg.gain.setValueAtTime(v||0.05,t);hg.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    src.connect(hp);hp.connect(hg);hg.connect(master);src.start(t);
  }
  // ── Original synth lead melody (A major, K-pop inspired phrasing) ─
  // Completely original composition — no reproduction of any published work
  var LEAD=[
    [0,.5,880],[.5,.25,987.77],[.75,.25,880],[1,.5,739.99],[1.5,.5,659.26],
    [2,.5,739.99],[2.5,.25,880],[2.75,.25,739.99],[3,.5,659.26],[3.5,.5,587.33],
    [4,.5,659.26],[4.5,.25,739.99],[4.75,.25,659.26],[5,.5,587.33],[5.5,.5,554.37],
    [6,.5,587.33],[6.5,.25,659.26],[6.75,.25,587.33],[7,.75,493.88],[7.75,.25,440]
  ];
  function lead(t0){
    LEAD.forEach(function(n){
      var o=ac.createOscillator(),gn=ac.createGain(),lp=ac.createBiquadFilter();
      o.type='sawtooth';o.frequency.value=n[2];
      lp.type='lowpass';lp.frequency.value=4000;lp.Q.value=1.5;
      // Portamento feel
      o.frequency.setValueAtTime(n[2]*0.97,t0+n[0]*bt2);
      o.frequency.linearRampToValueAtTime(n[2],t0+n[0]*bt2+0.04);
      var dur=n[1]*bt2;
      gn.gain.setValueAtTime(0,t0+n[0]*bt2);gn.gain.linearRampToValueAtTime(0.09,t0+n[0]*bt2+0.03);
      gn.gain.exponentialRampToValueAtTime(0.001,t0+n[0]*bt2+dur*0.85);
      o.connect(lp);lp.connect(gn);gn.connect(rev);gn.connect(master);
      o.start(t0+n[0]*bt2);o.stop(t0+n[0]*bt2+dur);
    });
  }

  // ── 8-bar loop ───────────────────────────────────────────────────
  var BARS2=8;var loopLen2=br2*BARS2;
  function gameLoop(offset){
    var t=ac.currentTime+0.05+offset;
    for(var bi=0;bi<BARS2;bi++){
      var ci=bi%4,ch=CH2[ci],rt=BASS2[ci];
      var chorus=bi>=4;
      // Pad every bar
      pad(ch,t+bi*br2,br2*1.02);
      // Arp every bar (chorus = higher gain arp)
      arp(ch,t+bi*br2);
      // Bass
      bass2(rt,t+bi*br2);
      // Drums
      for(var b=0;b<4;b++){
        var bt=t+bi*br2+b*bt2;
        kick2(bt);// four on the floor
        if(b===1||b===3)clap2(bt);
        hat2(bt,0.04);hat2(bt+bt2*.5,chorus?0.05:0.03);
        hat2(bt+bt2*.25,0.025);hat2(bt+bt2*.75,0.025);
      }
    }
    // Lead over full 8 bars (2 phrases)
    lead(t);lead(t+br2*4);
    if(_gameLoop)setTimeout(function(){gameLoop(loopLen2-0.12);},Math.max(0,(loopLen2-0.18)*1000));
  }
  gameLoop(0);
}

function switchToGameMusic(){
  _AC().resume();
  if(!_musicStarted)startTSMusic();
  // Fade intro out
  _introLoop=false;
  if(_introGain)_introGain.gain.setTargetAtTime(0,_AC().currentTime,0.5);
  startGameMusic();
}
function switchToIntroMusic(){
  // Stop game loop, fade it out
  _gameLoop=false;_gameMusic=false;
  if(_gameGain)_gameGain.gain.setTargetAtTime(0,_AC().currentTime,0.5);
  // Restart intro loop if needed
  if(_introGain)_introGain.gain.setTargetAtTime(0.22,_AC().currentTime,0.6);
}
// Auto-start on first user gesture
['click','keydown','touchstart'].forEach(function(ev){
  document.addEventListener(ev,function once(){startTSMusic();document.removeEventListener(ev,once);},{once:true});
});
var cv=document.getElementById('c');
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

  g.fillStyle='#f5f0e0';g.beginPath();g.ellipse(x,y,13,8,0.2,0,6.28);g.fill();
  // Wing feather tone
  g.fillStyle='#e8e0cc';
  g.beginPath();g.ellipse(x+2,y-2,9,5,0.25,0,Math.PI);g.fill();
  // Tail
  g.fillStyle='#e0d8c4';
  g.beginPath();g.moveTo(x-10,y-1);g.bezierCurveTo(x-17,y-7,x-18,y+1,x-13,y+4);g.closePath();g.fill();
  // Neck
  g.strokeStyle='#f5e8d0';g.lineWidth=5;g.lineCap='round';
  g.beginPath();g.moveTo(x+9,y-4);g.lineTo(x+10,y-14);g.stroke();
  // Head - warm golden yellow
  g.fillStyle='#f0c840';g.beginPath();g.arc(x+10,y-17,7,0,6.28);g.fill();
  // Beak
  g.fillStyle='#f0820a';
  g.beginPath();g.moveTo(x+15,y-18);g.lineTo(x+22,y-16);g.lineTo(x+15,y-14);g.closePath();g.fill();
  // Eye
  g.fillStyle='#1a1a1a';g.beginPath();g.arc(x+12,y-18,2,0,6.28);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(x+12.5,y-18.5,0.8,0,6.28);g.fill();
  g.restore();
}

function drawBirds(){
  _birds.forEach(function(b){
    b.wx+=b.dir*b.spd;
    if(b.wx<120){b.wx=120;b.dir=1;}
    if(b.wx>WORLD-120){b.wx=WORLD-120;b.dir=-1;}
    var bx=scx(b.wx);if(bx<-70||bx>W+70)return;
    var bob=Math.sin(tick*0.038+b.phase)*2.5;
    var anim=tick*0.05+b.flapPhase;
    if(b.type==='swan')drawSwan(bx,FLOOR+72+bob,b.dir,anim);
    else drawDuck(bx,FLOOR+72+bob,b.dir,anim);
  });
}

function drawBG(){

  // ★ STAGE 4 TROPICAL LAGOON — lagoon + palm trees

    for(var lfe=0;lfe<=W;lfe+=12)
      g.lineTo(lfe,ly+Math.sin(lfe*.06+tick*.03)*3);

    // Tropical palm trees (world-space)

      g.bezierCurveTo(px2+4,FLOOR-ph,px2,FLOOR-ph,px2-2,FLOOR-ph);
      g.bezierCurveTo(px2-10,FLOOR-ph*.7,px2+3,FLOOR-ph*.4,px2+5,FLOOR);
      g.closePath();g.fill();
      // Coconuts
      g.fillStyle='#704010';
      [[0,0],[8,-4],[-6,-2]].forEach(function(c){
        g.beginPath();g.arc(px2+c[0]+3,FLOOR-ph+c[1]+4,4,0,6.28);g.fill();
      });
      // Fronds (bright tropical green)

  // ★ STAGE 5 SHIPWRECK BAY — shipwreck in the background
  if(state==='play'&&currentLevel===4){
    // Moody overcast sky
    var wsky=g.createLinearGradient(0,0,0,FLOOR);
    wsky.addColorStop(0,'#1a2530');wsky.addColorStop(.6,'#2a4050');wsky.addColorStop(1,'#405060');
    g.fillStyle=wsky;g.fillRect(0,0,W,FLOOR);

      g.beginPath();g.ellipse(wcx,wcy,90,22,0,0,6.28);g.fill();

      g.lineTo(100,60);g.lineTo(-90,60);g.closePath();g.stroke();
      // Deck planks

      g.beginPath();g.moveTo(20,0);g.lineTo(10,-100);g.stroke();
      g.lineWidth=4;
      g.beginPath();g.moveTo(10,-100);g.lineTo(40,-88);g.stroke();
      g.lineWidth=2;
      // Torn sail
      g.fillStyle='rgba(180,170,150,.55)';
      g.beginPath();g.moveTo(10,-98);g.lineTo(38,-86);
      g.lineTo(28+Math.sin(tick*.05)*6,-50);g.lineTo(8,-60);g.closePath();g.fill();
      // Rigging lines
      g.strokeStyle='rgba(60,40,20,.7)';g.lineWidth=1;
      [[10,-98,80,-5],[10,-60,-80,2]].forEach(function(l){
        g.beginPath();g.moveTo(l[0],l[1]);g.lineTo(l[2],l[3]);g.stroke();
      });
      // Portholes
      g.fillStyle='#202830';
      [-60,-20,30,70].forEach(function(px3){
        g.beginPath();g.arc(px3,28,7,0,6.28);g.fill();
        g.strokeStyle='#604030';g.lineWidth=1.5;
        g.beginPath();g.arc(px3,28,7,0,6.28);g.stroke();
      });
      g.restore();
      // Seaweed clinging to hull
      g.strokeStyle='rgba(30,80,40,.7)';g.lineWidth=2;g.lineCap='round';
      for(var swi=0;swi<8;swi++){

  // ★ STAGE 6 STARFISH SANDS — starfish scattered on the sand and in the water

    stsky.addColorStop(0,'#020510');stsky.addColorStop(.5,'#080c28');stsky.addColorStop(1,'#101840');
    g.fillStyle=stsky;g.fillRect(0,0,W,FLOOR);

      var stbr=Math.sin(tick*.04+sti*.8)*.5+.5;

      g.beginPath();g.arc(stx2,sty2,sti%3===0?1.5:0.8,0,6.28);g.fill();
    }
    g.globalAlpha=1;

    var mx=W*.78,my=FLOOR*.22;
    var mglow=g.createRadialGradient(mx,my,0,mx,my,80);
    mglow.addColorStop(0,'rgba(200,220,255,.18)');mglow.addColorStop(1,'rgba(150,180,255,0)');
    g.fillStyle=mglow;g.fillRect(mx-80,my-80,160,160);
    g.fillStyle='#dde8ff';g.beginPath();g.arc(mx,my,22,0,6.28);g.fill();
    g.fillStyle='rgba(8,12,40,.5)';g.beginPath();g.arc(mx-6,my-4,17,0,6.28);g.fill();
    // Bioluminescent water glow
    var bwg=g.createLinearGradient(0,FLOOR,0,FLOOR+40);
    bwg.addColorStop(0,'rgba(0,200,180,.3)');bwg.addColorStop(1,'rgba(0,100,120,0)');
    g.fillStyle=bwg;g.fillRect(0,FLOOR,W,40);
    // Starfish on the sand (world-space, drawn above floor later but preview here)
    function drawStarfish(sfx,sfy,sfr,sfc){
      g.fillStyle=sfc;
      g.beginPath();
      for(var sfi2=0;sfi2<5;sfi2++){
        var sa1=sfi2/5*6.28-Math.PI/2,sa2=(sfi2+.5)/5*6.28-Math.PI/2;
        sfi2===0?g.moveTo(sfx+Math.cos(sa1)*sfr,sfy+Math.sin(sa1)*sfr):
                 g.lineTo(sfx+Math.cos(sa1)*sfr,sfy+Math.sin(sa1)*sfr);
        g.lineTo(sfx+Math.cos(sa2)*sfr*.42,sfy+Math.sin(sa2)*sfr*.42);
      }g.closePath();g.fill();
      g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=.8;g.stroke();
      g.fillStyle='rgba(255,255,255,.25)';
      g.beginPath();g.arc(sfx,sfy,sfr*.2,0,6.28);g.fill();
    }
    var sfcols=['#e83040','#ff6050','#e84020','#ff8030','#c83050'];
    var sfSpots=[180,380,620,850,1100,1400,1700,2050,2400,2800,3200,3600,4000,4400,4800,5200];
    sfSpots.forEach(function(wx,si3){
      var sfsx=scx(wx);if(sfsx<-40||sfsx>W+40)return;
      var sfr2=10+si3%4*5;

    });
    // Glowing starfish in the water
    var wfSpots=[250,550,900,1300,1800,2300,2900,3500,4200,4900];
    wfSpots.forEach(function(wx,wi2){
      var wfsx=scx(wx);if(wfsx<-40||wfsx>W+40)return;
      g.globalAlpha=.7+Math.sin(tick*.06+wi2)*.2;
      drawStarfish(wfsx,FLOOR+30+wi2%3*15,8+wi2%3*4,sfcols[wi2%5]);
      // Bioluminescent glow
      var sfglow=g.createRadialGradient(wfsx,FLOOR+30+wi2%3*15,0,wfsx,FLOOR+30+wi2%3*15,20);
      sfglow.addColorStop(0,'rgba(0,220,180,.3)');sfglow.addColorStop(1,'rgba(0,180,150,0)');
      g.fillStyle=sfglow;g.globalAlpha=.5;
      g.beginPath();g.arc(wfsx,FLOOR+30+wi2%3*15,20,0,6.28);g.fill();
      g.globalAlpha=1;
    });
  }

  // ★ STAGE 7 MERMAID COVE — seashells and clams
  if(state==='play'&&currentLevel===6){
    // Soft dreamy sky for the cove
    var mcsky=g.createLinearGradient(0,0,0,FLOOR);
    mcsky.addColorStop(0,'#1a1060');mcsky.addColorStop(.45,'#5020a0');
    mcsky.addColorStop(.8,'#c050a0');mcsky.addColorStop(1,'#f090c0');
    g.fillStyle=mcsky;g.fillRect(0,0,W,FLOOR);
    // Soft sparkle stars
    for(var mci=0;mci<50;mci++){
      var msx=(mci*173)%W,msy=(mci*107)%(FLOOR*.6);
      g.globalAlpha=Math.sin(tick*.05+mci)*.4+.4;
      g.fillStyle='#ffe8ff';
      g.beginPath();g.arc(msx,msy,.9+mci%2,0,6.28);g.fill();
    }
    g.globalAlpha=1;

    // --- draw one spiral/conch shell ---
    function drawConch(cx,cy,sz,col){
      g.save();g.translate(cx,cy);
      // Body coil
      g.fillStyle=col;
      g.beginPath();g.ellipse(0,0,sz,sz*.62,0,0,6.28);g.fill();
      // Spiral ridges
      g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=.9;
      for(var ri3=1;ri3<=4;ri3++){
        g.beginPath();g.ellipse(0,0,sz*ri3*.24,sz*ri3*.15,0,0,Math.PI);g.stroke();
      }
      // Point
      g.fillStyle=col;
      g.beginPath();g.moveTo(sz*.7,0);g.lineTo(sz*1.3,-sz*.3);g.lineTo(sz*.8,-sz*.08);g.closePath();g.fill();
      // Lip
      g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=1.5;
      g.beginPath();g.ellipse(0,sz*.1,sz*.55,sz*.28,-0.3,Math.PI,0);g.stroke();
      // Highlight
      g.fillStyle='rgba(255,255,255,.3)';
      g.beginPath();g.ellipse(-sz*.2,-sz*.18,sz*.22,sz*.1,-0.4,0,6.28);g.fill();
      g.restore();
    }

    // --- draw one scallop/fan shell ---
    function drawScallop(cx,cy,sz,col){
      g.save();g.translate(cx,cy);
      g.fillStyle=col;
      // Base half-circle
      g.beginPath();g.arc(0,0,sz,Math.PI,0);g.closePath();g.fill();
      // Fan ribs
      g.strokeStyle='rgba(0,0,0,.15)';g.lineWidth=1;
      for(var sfi3=0;sfi3<=6;sfi3++){
        var sa=Math.PI-sfi3*(Math.PI/6);
        g.beginPath();g.moveTo(0,0);
        g.lineTo(Math.cos(sa)*sz,Math.sin(sa)*sz);g.stroke();
      }
      // Hinge bump
      g.fillStyle='rgba(0,0,0,.15)';
      g.beginPath();g.arc(0,0,sz*.18,0,6.28);g.fill();
      g.fillStyle='rgba(255,255,255,.35)';
      g.beginPath();g.ellipse(-sz*.25,-sz*.35,sz*.22,sz*.1,-.5,0,6.28);g.fill();
      g.restore();
    }

    // --- draw a clam (open or closed) ---
    function drawClam(cx,cy,sz,col,open){
      g.save();g.translate(cx,cy);
      var openAng=open?Math.min(.7,open*.7):0;
      // Bottom shell
      g.fillStyle=col;
      g.beginPath();g.arc(0,0,sz,0,Math.PI);g.closePath();g.fill();
      g.strokeStyle='rgba(0,0,0,.15)';g.lineWidth=1;
      g.beginPath();g.arc(0,0,sz,0,Math.PI);g.closePath();g.stroke();
      // Ribs on bottom
      for(var ci2=0;ci2<=5;ci2++){
        var ca=Math.PI*ci2/5;
        g.strokeStyle='rgba(0,0,0,.1)';g.lineWidth=.8;
        g.beginPath();g.moveTo(0,0);
        g.lineTo(Math.cos(ca)*sz,Math.sin(ca)*sz);g.stroke();

function drawSeaStar(x,y){
  var cx=x, cy=y+10; // disc centre
  // ── 5 arms, each pivoted & animated individually ──────────
  var _ssi=_PA.idle*0.14;
  // on jump: all 5 arms splay outward (rotate away from center)
  var _ssJump=_PA.reach*0.5;
  var _ssD=[
    _PA.air?0:(_PA.running?0:Math.sin(tick*0.06+0)*_ssi),
    _PA.air? _ssJump:(_PA.running? _PA.step*0.28:Math.sin(tick*0.06+1.26)*_ssi),
    _PA.air? _ssJump*1.2:(_PA.running?-_PA.step*0.38:Math.sin(tick*0.06+2.51)*_ssi),
    _PA.air?0-_ssJump*1.2:(_PA.running? _PA.step*0.38:Math.sin(tick*0.06+3.77)*_ssi),

  var baseAngs=[-1.5708,-0.3142,0.9425,2.1991,3.4558];

  // ── Central disc ─────────────────────────────────────────
  g.fillStyle='#e86818';
  g.beginPath();g.arc(cx,cy,11,0,6.28);g.fill();

  g.beginPath();g.arc(cx,cy,8,0,6.28);g.fill();

  g.beginPath();g.arc(cx+3,cy-2.5,1.2,0,6.28);g.fill();

// ── CORAL DRAW FUNCTIONS (Coral Cove – stage 2) ───────────────────
function drawBranchCoral(x,y,sz,col){
  g.strokeStyle=col;g.lineCap='round';
  // Iterative stack-based branch (no recursion = no silent crash)
  var stack=[{bx:x,by:y,angle:-Math.PI/2,len:sz,depth:4}];
  while(stack.length){
    var b=stack.pop();
    if(b.depth<0||b.len<3)continue;
    var ex=b.bx+Math.cos(b.angle)*b.len,ey=b.by+Math.sin(b.angle)*b.len;
    g.lineWidth=Math.max(1,b.depth*1.8);
    g.beginPath();g.moveTo(b.bx,b.by);g.lineTo(ex,ey);g.stroke();
    stack.push({bx:ex,by:ey,angle:b.angle-.42,len:b.len*.68,depth:b.depth-1});
    stack.push({bx:ex,by:ey,angle:b.angle+.42,len:b.len*.68,depth:b.depth-1});
    if(b.depth>2)stack.push({bx:ex,by:ey,angle:b.angle-.05,len:b.len*.5,depth:b.depth-2});
  }
  g.fillStyle='rgba(255,200,220,.85)';
  g.beginPath();g.arc(x-sz*.2,y-sz*.9,sz*.08,0,6.28);g.fill();
  g.beginPath();g.arc(x+sz*.25,y-sz*.85,sz*.07,0,6.28);g.fill();
  g.beginPath();g.arc(x,y-sz,sz*.09,0,6.28);g.fill();
}
function drawFanCoral(x,y,sz,col){
  g.strokeStyle=col;g.lineWidth=1.5;g.lineCap='round';
  // Stem
  g.beginPath();g.moveTo(x,y);g.lineTo(x,y-sz*.25);g.stroke();
  // Fan ribs
  for(var i=0;i<11;i++){
    var a=-Math.PI*.75+(i/10)*Math.PI*1.5;
    var rx=x+Math.cos(a)*sz*.85,ry=y-sz*.25+Math.sin(a)*sz*.85;
    g.lineWidth=1+((i===5)?1:0);
    g.beginPath();g.moveTo(x,y-sz*.25);g.lineTo(rx,ry);g.stroke();
  }
  // Webbing arcs
  g.lineWidth=.8;g.globalAlpha=.5;
  for(var ri6=1;ri6<=4;ri6++){
    var fr=sz*.2*ri6;
    g.beginPath();
    g.arc(x,y-sz*.25,fr,-Math.PI*.75,Math.PI*.75*.1*11-Math.PI*.75);
    g.stroke();
  }
  g.globalAlpha=1;
}
function drawTubeCoral(x,y,sz,col){
  var cols=[col,'#ff8888','#ffaacc','#ff60a0'];
  var count=3+Math.floor(sz/10);
  for(var ti=0;ti<count;ti++){
    var tx=x+(ti-(count-1)/2)*sz*.38;
    var th=sz*(.55+Math.sin(ti*1.3+_s*.01)*.2);
    var tw=sz*.12;
    var tc=cols[ti%4];
    g.fillStyle=tc;
    g.beginPath();g.roundRect(tx-tw,y-th,tw*2,th,tw*.7);g.fill();
    g.fillStyle='rgba(255,255,255,.35)';
    g.beginPath();g.ellipse(tx,y-th,tw*.6,tw*.5,0,0,6.28);g.fill();
    // Rim
    g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=.8;
    g.beginPath();g.roundRect(tx-tw,y-th,tw*2,th,tw*.7);g.stroke();
  }
}
function drawBrainCoral(x,y,sz,col){
  g.fillStyle=col;
  g.beginPath();g.arc(x,y-sz*.5,sz*.5,0,6.28);g.fill();
  // Ridges
  g.strokeStyle='rgba(0,0,0,.22)';g.lineWidth=1.2;
  for(var bi2=0;bi2<6;bi2++){
    var ba=bi2/6*Math.PI,boffx=Math.cos(ba+Math.PI*.5)*sz*.3;
    g.beginPath();
    g.arc(x+boffx,y-sz*.5,sz*.22,ba,ba+Math.PI*.8);
    g.stroke();
  }
  g.fillStyle='rgba(255,200,180,.25)';
  g.beginPath();g.arc(x-sz*.14,y-sz*.65,sz*.18,0,6.28);g.fill();
}
function drawBubbleCoral(x,y,sz,col){
  var bcols=[col,'#ffbbdd','#ff99cc','#ffddee'];
  var bubbles=[[0,0,1],[-.4,.1,.8],[.4,.05,.75],[-.2,-.3,.7],[.3,-.25,.65],[0,-.5,.6]];
  bubbles.forEach(function(b,bi3){
    var bx=x+b[0]*sz*.5,by=y-sz*.2+b[1]*sz*.5,br=sz*.22*b[2];
    g.fillStyle=bcols[bi3%4];
    g.beginPath();g.arc(bx,by,br,0,6.28);g.fill();
    g.fillStyle='rgba(255,255,255,.4)';
    g.beginPath();g.arc(bx-br*.25,by-br*.28,br*.3,0,6.28);g.fill();
  });
}

function drawPlumeria(px,py,sz,col1,col2){

// ── LAND-ON HELPER ───────────────────────────────────────────
// isPlayer=true respects P_dropping (skip float platforms while dropping)
function landOn(ex,ey,ew,eh,evy,isPlayer){
  for(var i=0;i<platforms.length;i++){
    var p=platforms[i];
    if(isPlayer&&P_dropping>0&&!p.ground)continue;// drop-through
    if(ex+ew>p.x+2&&ex<p.x+p.w-2&&ey+eh>p.y&&ey+eh<p.y+p.h+Math.abs(evy)+4&&evy>=0)
      return p;
  }return null;
}
// ── BARRICADE SOLID CHECK (push entity out) ────────────────
function barrXPush(ex,ey,ew,eh,evx){
  // returns adjusted x (or original) after bouncing off barricade side
  for(var i=0;i<barricades.length;i++){
    var b=barricades[i];if(!b.alive)continue;
    if(ex+ew>b.x+2&&ex<b.x+b.w-2&&ey+eh>b.y+4&&ey<b.y+b.h){
      return evx>0?b.x-ew:b.x+b.w;
    }
  }return ex;
}
// returns true if landing on top of a barricade
function barrTopLand(ex,ey,ew,eh,evy){
  for(var i=0;i<barricades.length;i++){
    var b=barricades[i];if(!b.alive)continue;
    if(ex+ew>b.x+2&&ex<b.x+b.w-2&&ey+eh>=b.y&&ey+eh<=b.y+evy+6&&evy>=0)
      return b;
  }return null;
}

// ── DRAW PLAYER ──────────────────────────────────────────────
function drawPlayer(){
  if(P.dead)return;
  if(P.invTimer>0&&Math.floor(tick/4)%2)return;
  var ch=CHARS_FLAT[selectedChar];
  var sx3=scx(P.x);
  // Shield bubble (Glinda / piglet special)
  if(P.specialFX==='shield'){
    var st2=Math.sin(tick*.08);
    g.strokeStyle='rgba(255,200,255,'+(.5+st2*.2)+')';g.lineWidth=3;
    g.beginPath();g.arc(sx3+P.w/2,P.y+P.h/2,P.w*.9+st2*4,0,6.28);g.stroke();
    g.globalAlpha=.12;g.fillStyle='#ffccff';
    g.beginPath();g.arc(sx3+P.w/2,P.y+P.h/2,P.w*.9+st2*4,0,6.28);g.fill();
    g.globalAlpha=1;
  }
  g.save();
  // Mew levitation – float 14px above ground with gentle sine bob
  var _mewFloat=(ch.name==='Mew')?(-14+Math.sin(tick*0.045)*4):0;
  if(ch.name==='Mew'&&P.onGround){
    // Psychic shimmer halo on the ground beneath her
    var _msx=sx3+P.w/2;
    g.save();g.globalAlpha=0.22+Math.sin(tick*0.08)*0.08;
    var _msg=g.createRadialGradient(_msx,P.y+P.h-2,0,_msx,P.y+P.h-2,18);
    _msg.addColorStop(0,'rgba(180,100,255,.9)');
    _msg.addColorStop(1,'rgba(140,60,255,0)');
    g.fillStyle=_msg;g.beginPath();g.ellipse(_msx,P.y+P.h-2,18,6,0,0,6.28);g.fill();
    g.restore();
  }
  g.translate(sx3+P.w/2,P.y+P.h+_mewFloat);
  if(P.dir<0)g.scale(-1,1);
  g.scale(0.84,0.84);
  // Compute per-limb animation state for character draw fns
  _PA.step    = Math.sin(tick*0.28);
  _PA.idle    = Math.sin(tick*0.055);
  _PA.running = P.onGround && Math.abs(P.vx)>0.8;
  _PA.air     = !P.onGround;
  _PA.rising  = P.vy<0;
  // reach: 0=grounded, 1=peak jump
  _PA.reach   = _PA.air ? Math.max(0, Math.min(1, (0-P.vy)/10)) : 0;
  // fS: face-shift — nudge eyes/nose toward leading side (positive x = forward)
  _PA.fS = _PA.running ? 2.5 : (_PA.air ? 1.5 : 0);
  // ★ Squash • Stretch • Bob • Lean animation
  var aTy=0,aLean=0,aSx=1,aSy=1;
  if(_landTimer>0){
    // Land squash — wide & short
    var lf=_landTimer/9;
    aSx=1+lf*0.24;aSy=1-lf*0.18;aTy=lf*7;
  } else if(P.onGround){
    if(Math.abs(P.vx)>0.8){
      // Running: step bob + stronger forward lean so character looks sideways
      var stepSin=Math.abs(Math.sin(tick*0.28));
      aTy=0-stepSin*6;
      aSx=1+stepSin*0.06;aSy=1-stepSin*0.07;
      aLean=0.18;// steeper lean = character clearly faces direction of travel
    } else {
      // Idle: gentle breathing sway
      aTy=Math.sin(tick*0.055)*2.8;
      aLean=Math.sin(tick*0.042)*0.03;
    }
  } else {
    // Airborne squash & stretch
    if(P.vy<-4){aSx=0.86;aSy=1.16;aTy=-3;}      // fast rise — tall & thin
    else if(P.vy<0){aSx=0.92;aSy=1.08;}           // slow rise
    else if(P.vy<4){aSx=1.05;aSy=0.96;}           // peak/start falling
    else{aSx=1.10;aSy=0.91;aTy=3;}                // fast fall — wide & short
  }
  g.translate(0,aTy);
  g.rotate(aLean);
  g.scale(aSx,aSy);
  ch.draw(0,-42);
  g.restore();
  // Draw equipped accessory on player
  if(_equippedAcc){
    var _pax=scx(P.x)+P.w/2,_pay=P.y+2;
    drawAcc(_equippedAcc,_pax,_pay,0.88);
  }
}

    } else if(e.type==='tank'){

      g.fillStyle=fl?'#fff':e.col;g.beginPath();g.arc(0,0,e.w*.5,0,6.28);g.fill();
      // Armour plates
      g.fillStyle=fl?'#ddd':e.col2;
      g.beginPath();g.arc(0,0,e.w*.5,-.6,.6);g.lineTo(0,0);g.closePath();g.fill();
      g.beginPath();g.arc(0,0,e.w*.5,Math.PI-.6,Math.PI+.6);g.lineTo(0,0);g.closePath();g.fill();
      g.strokeStyle='rgba(100,0,80,.4)';g.lineWidth=1.5;
      g.beginPath();g.arc(0,0,e.w*.5,0,6.28);g.stroke();
      fC(-e.w*.18,-e.h*.06,e.w*.1,'#fff');fC(e.w*.18,-e.h*.06,e.w*.1,'#fff');
      fC(-e.w*.18,-e.h*.06,e.w*.06,e.eye);fC(e.w*.18,-e.h*.06,e.w*.06,e.eye);
      // Angry brow
      g.strokeStyle=e.col2;g.lineWidth=2;
      g.beginPath();g.moveTo(-e.w*.28,-e.h*.22);g.lineTo(-e.w*.1,-e.h*.14);g.stroke();
      g.beginPath();g.moveTo(e.w*.28,-e.h*.22);g.lineTo(e.w*.1,-e.h*.14);g.stroke();
    } else {
      // Flutter butterfly
      g.globalAlpha=.7;
      var wing=Math.sin(tick*.22)*0.5;
      g.fillStyle=fl?'#fff':e.col;
      g.save();g.rotate(wing);g.beginPath();g.ellipse(-e.w*.38,-e.w*.2,e.w*.4,e.w*.22,-.4,0,6.28);g.fill();g.restore();
      g.save();g.rotate(-wing);g.beginPath();g.ellipse(e.w*.38,-e.w*.2,e.w*.4,e.w*.22,.4,0,6.28);g.fill();g.restore();
      g.globalAlpha=1;
      fC(0,0,e.w*.22,fl?'#fff':e.col2);
      fC(-e.w*.1,-e.w*.28,e.w*.08,e.eye);fC(e.w*.1,-e.w*.28,e.w*.08,e.eye);
      // Antennae
      g.strokeStyle=e.col2;g.lineWidth=1.2;
      g.beginPath();g.moveTo(-e.w*.08,-e.w*.28);g.bezierCurveTo(-e.w*.2,-e.w*.55,-e.w*.32,-e.w*.6,-e.w*.28,-e.w*.5);g.stroke();
      g.beginPath();g.moveTo(e.w*.08,-e.w*.28);g.bezierCurveTo(e.w*.2,-e.w*.55,e.w*.32,-e.w*.6,e.w*.28,-e.w*.5);g.stroke();
    }
    // HP bar
    if(e.ihp>1){
      var bw2=e.w+4;
      fRR(-bw2/2,e.h*.52+2,bw2,5,2,'rgba(0,0,0,.3)');
      fRR(-bw2/2,e.h*.52+2,Math.max(0,bw2*e.hp/e.ihp),5,2,'#cc44aa');
    }
    g.restore();
  });
}

// ── DRAW BLASTS (heart projectiles) ──────────────────────────
function drawSeashell(sx,sy,sz){
  sz=sz||9;
  g.strokeStyle='#e8c490';g.lineWidth=sz*.22;g.lineCap='round';
  g.beginPath();g.arc(sx,sy,sz*.65,Math.PI*.1,Math.PI*1.7);g.stroke();
  g.strokeStyle='#d4a870';g.lineWidth=sz*.14;
  g.beginPath();g.arc(sx,sy,sz*.38,Math.PI*.3,Math.PI*1.5);g.stroke();
  g.strokeStyle='rgba(180,120,60,.5)';g.lineWidth=sz*.08;
  for(var ri3=0;ri3<6;ri3++){var ra=Math.PI*(.1+ri3*.26);
    g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.cos(ra)*sz*.7,sy+Math.sin(ra)*sz*.7);g.stroke();}
  g.fillStyle='rgba(255,200,180,.6)';g.beginPath();g.arc(sx,sy,sz*.22,0,6.28);g.fill();
  g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.arc(sx-sz*.18,sy-sz*.18,sz*.1,0,6.28);g.fill();
}
function drawBlasts(){
  pBlasts.forEach(function(b){
    if(!b.alive)return;
    var bsx=scx(b.x);
    g.save();g.translate(bsx,b.y);g.rotate(b.rot);
    var stretch=1+Math.hypot(b.vx,b.vy)*.06;
    g.scale(stretch*.55,0.7/stretch);
    g.fillStyle='#44aaff';g.globalAlpha=.88;
    g.beginPath();g.moveTo(0,-10);
    g.bezierCurveTo(7,-4,8,4,0,10);
    g.bezierCurveTo(-8,4,-7,-4,0,-10);
    g.closePath();g.fill();
    g.fillStyle='rgba(255,255,255,.55)';
    g.beginPath();g.ellipse(-2,-4,2.5,4,-.4,0,6.28);g.fill();
    g.strokeStyle='rgba(30,100,220,.5)';g.lineWidth=1.2;
    g.beginPath();g.moveTo(0,-10);
    g.bezierCurveTo(7,-4,8,4,0,10);
    g.bezierCurveTo(-8,4,-7,-4,0,-10);
    g.closePath();g.stroke();
    g.restore();g.globalAlpha=1;
  });
}

// ── DRAW PARTICLES ───────────────────────────────────────────
function drawParticles(){
  gParticles.forEach(function(p){
    var a=Math.max(0,1-p.life/p.max);
    g.globalAlpha=a;fC(scx(p.x),p.y,p.r*(1-p.life/p.max*.5),p.col);
  });
  g.globalAlpha=1;
}

// ── PARTICLE BURST ───────────────────────────────────────────
function burst(wx,wy,col,n){
  for(var i=0;i<(n||6);i++){
    var a=Math.random()*6.28,sp=2+Math.random()*4;
    gParticles.push({x:wx,y:wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
      col:col,life:0,max:22+Math.random()*18,r:3+Math.random()*3});
  }
}

// 0=Marie 1=Angel 2=Charlotte 3=Pearl 4=Piglet
// 5=Sylveon 6=Mew 7=Flora 8=Glinda 9=Blossom
// ── PER-CHARACTER SPECIALS (10 kills = full meter) ──────────────
// Each entry: name, col (meter colour), icon shown in HUD
var SPECIALS=[
  {name:'Nine Lives',      col:'#fffafa', icon:'🐾'},// 0 Marie
  {name:'Stardust Rain',   col:'#ffb3d9', icon:'⭐'},// 1 Angel
  {name:'La Bouff Powder', col:'#ff44cc', icon:'💄'},// 2 Charlotte

  {name:'Honey Trap',      col:'#f2a7c3', icon:'🍯'},// 4 Piglet

  {name:'Reflect',         col:'#cc88ff', icon:'🔮'},// 6 Mew
  {name:'Good Fairy',      col:'#ff88aa', icon:'🌸'},// 7 Flora
  {name:'Defying Gravity', col:'#ffd700', icon:'✨'},// 8 Glinda
  {name:'Hyper Blossom',   col:'#ff44aa', icon:'❄️'},// 9 Blossom
];

function activateSpecial(){
  if(P.specialMeter<100||P.specialCd>0)return;
  var ci=selectedChar%SPECIALS.length;
  P.specialMeter=0;P.specialCd=240;
  _msg=SPECIALS[ci].icon+' '+SPECIALS[ci].name+'!';_msgTimer=90;

  if(ci===0){// Marie – Nine Lives: orbiting hearts shield + invincibility
    P.specialFX='shield';P.specialTimer=260;P.invTimer=260;
    for(var mi=0;mi<8;mi++){var ma=mi/8*6.28;
      hearts.push({x:P.x+P.w/2+Math.cos(ma)*55,y:P.y+P.h/2+Math.sin(ma)*38,alive:true,bob:ma});}
    burst(P.x+P.w/2,P.y,'#fffafa',12);

  }else if(ci===1){// Angel – Stardust Rain: stars fall from above damaging all enemies on screen
    P.specialFX='spin';P.specialTimer=90;
    for(var ai=0;ai<20;ai++){
      var ax=cam+Math.random()*W;
      gParticles.push({x:ax,y:0,vx:(Math.random()-.5)*2,vy:8+Math.random()*6,
        col:'#ffccee',life:0,max:60+Math.random()*30,r:5+Math.random()*4,isStar:true});
    }
    enemies.forEach(function(e){if(!e.alive)return;if(scx(e.x)>0&&scx(e.x)<W){e.hp-=3;burst(e.x+e.w/2,e.y,'#ffb3d9',6);if(e.hp<=0){e.alive=false;P.score+=e.pts;}}});

  }else if(ci===2){// Charlotte – La Bouff Powder: glitter storm kills ALL on-screen enemies
    P.specialFX='powder';P.specialTimer=150;
    enemies.forEach(function(e){if(!e.alive)return;var esx=scx(e.x);if(esx>-60&&esx<W+60){e.hp=0;e.alive=false;P.score+=e.pts;burst(e.x+e.w/2,e.y,'#ff88cc',12);}});
    for(var ppi=0;ppi<60;ppi++)gParticles.push({x:cam+(Math.random()*W),y:Math.random()*FLOOR,
      vx:(Math.random()-.5)*4,vy:Math.random()*3+1,col:['#ff88cc','#ffccee','#fff0f8','#ffb3d9','#ffdd44'][ppi%5],
      life:0,max:100+Math.random()*60,r:3+Math.random()*5});

  }else if(ci===3){// Pearl – Ink Blast: giant ink ball freezes all on-screen enemies 4s
    P.specialFX='ink';P.specialTimer=100;
    enemies.forEach(function(e){if(!e.alive)return;e.hitTimer=240;burst(e.x+e.w/2,e.y,'#9944dd',6);});
    for(var ii=0;ii<25;ii++)gParticles.push({x:P.x+P.w/2+(Math.random()-.5)*250,y:P.y+(Math.random()-.5)*200,
      vx:(Math.random()-.5)*6,vy:-Math.random()*5,col:'#cc88ff',life:0,max:60+Math.random()*40,r:4+Math.random()*5});

  }else if(ci===4){// Piglet – Honey Trap: float balloon + drop sticky honey bombs
    P.specialFX='balloon';P.specialTimer=280;P.invTimer=180;P.vy=-10;
    for(var hni=0;hni<5;hni++){
      var hna=hni/5*6.28;
      gParticles.push({x:P.x+P.w/2+Math.cos(hna)*80,y:P.y+P.h/2+Math.sin(hna)*50,
        vx:Math.cos(hna)*3,vy:-2,col:'#f2c270',life:0,max:120,r:8,isHoney:true});
    }

  }else if(ci===5){// Sylveon – Draining Kiss: ribbons pull ALL on-screen enemies toward player + damage
    P.specialFX='ribbon';P.specialTimer=100;
    enemies.forEach(function(e){if(!e.alive)return;if(scx(e.x)>-40&&scx(e.x)<W+40){
      e.hp-=2;e.vx=P.x<e.x?-3:3;e.x+=P.x<e.x?-30:30;// yank
      burst(e.x+e.w/2,e.y,'#ff9eb5',5);if(e.hp<=0){e.alive=false;P.score+=e.pts;}}});

  }else if(ci===6){// Mew – Reflect: mirror bubble that bounces all projectiles + collects everything
    P.specialFX='psychic';P.specialTimer=180;P.invTimer=180;
    hearts.forEach(function(h){if(!h.alive)return;if(scx(h.x)>0&&scx(h.x)<W){h.alive=false;P.score+=10;}});
    gems.forEach(function(gm){if(!gm.alive)return;if(scx(gm.x)>0&&scx(gm.x)<W){gm.alive=false;P.score+=50;}});
    BOSS.projs.forEach(function(p){p.vx*=-1;p.vy*=-1;});
    burst(P.x+P.w/2,P.y+P.h/2,'#cc88ff',16);

  }else if(ci===7){// Flora – Good Fairy: flower petal rain heals player + damages enemies
    P.specialFX='bloom';P.specialTimer=180;
    P.lives=Math.min(P.lives+1,8);_msg='🌸 +1 LIFE!';
    enemies.forEach(function(e){if(!e.alive)return;if(scx(e.x)>-40&&scx(e.x)<W+40){
      e.hp-=3;burst(e.x+e.w/2,e.y,'#ff88aa',7);if(e.hp<=0){e.alive=false;P.score+=e.pts;}}});
    for(var fi=0;fi<50;fi++)gParticles.push({x:cam+Math.random()*W,y:0,
      vx:(Math.random()-.5)*2,vy:2+Math.random()*3,col:['#ff88aa','#ffccee','#ffaad4','#ffe0ee'][fi%4],
      life:0,max:140+Math.random()*40,r:3+Math.random()*4});

  }else if(ci===8){// Glinda – Defying Gravity: float 5s + complete shield bubble
    P.specialFX='shield';P.specialTimer=320;P.invTimer=320;P.vy=-6;
    burst(P.x+P.w/2,P.y,'#ffd700',15);

  }else if(ci===9){// Blossom – Hyper Blossom: ice blast freezes all + triple shot 5s
    P.specialFX='dash';P.specialTimer=300;
    P_dblBlast=300;// use existing dbl blast timer for triple mode
    enemies.forEach(function(e){if(!e.alive)return;e.hitTimer=180;e.col='#88ccff';// freeze blue tint
      burst(e.x+e.w/2,e.y,'#88aaff',6);});
    for(var ci2=0;ci2<30;ci2++)gParticles.push({x:P.x+P.w/2+(Math.random()-.5)*200,y:P.y,
      vx:(Math.random()-.5)*8,vy:-Math.random()*6,col:'#88ddff',life:0,max:50+Math.random()*30,r:3+Math.random()*4});
  }
}

function drawSpecialFX(){
  if(!P.specialTimer)return;
  P.specialTimer--;
  if(P.specialFX==='powder'){
    // Pink powder overlay
    var fade=Math.min(1,P.specialTimer/30);
    g.fillStyle='rgba(255,180,220,'+(.28*fade)+')';g.fillRect(0,0,W,H);
    // Sparkle confetti
    gParticles.forEach(function(p){if(p.r>3&&p.col==='#ffb3d9')p.vy+=.08;});
  } else if(P.specialFX==='spin'){
    // Ring expand
    var ring=1-(P.specialTimer/60);
    g.strokeStyle='rgba(255,179,217,'+(.8*(1-ring))+')';g.lineWidth=4;
    g.beginPath();g.arc(scx(P.x+P.w/2),P.y+P.h/2,ring*220,0,6.28);g.stroke();
  } else if(P.specialFX==='ribbon'){
    var sweep=(1-P.specialTimer/80)*W;
    g.strokeStyle='rgba(255,158,181,.6)';g.lineWidth=8;
    g.beginPath();g.moveTo(0,P.y+P.h/2-10);g.lineTo(sweep,P.y+P.h/2-10);g.stroke();
    g.strokeStyle='rgba(170,196,255,.5)';g.lineWidth=5;
    g.beginPath();g.moveTo(0,P.y+P.h/2+8);g.lineTo(sweep,P.y+P.h/2+8);g.stroke();
  } else if(P.specialFX==='psychic'){
    g.fillStyle='rgba(200,136,255,'+(.15*(P.specialTimer/60))+')';g.fillRect(0,0,W,H);
  } else if(P.specialFX==='ink'){
    g.fillStyle='rgba(80,0,120,'+(.18*(P.specialTimer/80))+')';g.fillRect(0,0,W,H);
  } else if(P.specialFX==='bloom'){
    var bfade=P.specialTimer/90;
    g.fillStyle='rgba(255,136,170,'+(.22*bfade)+')';g.fillRect(0,0,W,H);
  } else if(P.specialFX==='balloon'){
    // Gentle upward drift
    if(P.vy>-2)P.vy-=.4;
  } else if(P.specialFX==='dash'){
    g.fillStyle='rgba(255,136,204,'+(.3*(P.specialTimer/40))+')';g.fillRect(0,0,W,H);
  }
  if(P.specialTimer<=0){P.specialFX='';P.specialActive=0;}
}

// ── DRAW HUD ─────────────────────────────────────────────────
function drawHUD(){

}

    g.strokeStyle='rgba(200,148,100,.4)';g.lineWidth=1;g.beginPath();g.roundRect(bx5,by5,bw5,bh5,8);g.stroke();
    lbl('MAIN MENU',bx5+bw5/2,by5+19,'#f5e0c8',10);
    // START FROM BEGINNING — win screen
    var bx6=0,by6=0,bw6=148,bh6=30;
    if(_win){
      bx6=cx4-bw6/2;by6=by5+36;
      var hov6=_mx>bx6&&_mx<bx6+bw6&&_my>by6&&_my<by6+bh6;
      var sg6=g.createLinearGradient(bx6,by6,bx6+bw6,by6+bh6);
      sg6.addColorStop(0,hov6?'#2a8a50':'#1a6038');
      sg6.addColorStop(1,hov6?'#40aa70':'#2a8050');
      fRR(bx6,by6,bw6,bh6,9,'rgba(0,0,0,.25)');
      g.beginPath();g.roundRect(bx6,by6,bw6,bh6,9);g.fillStyle=sg6;g.fill();
      g.strokeStyle='rgba(120,240,160,.55)';g.lineWidth=1;g.beginPath();g.roundRect(bx6,by6,bw6,bh6,9);g.stroke();
      lbl('↺ START FROM BEGINNING',bx6+bw6/2,by6+20,'#d0ffe0',11);
    }
    // PLAY FROM BEGINNING — game over screen
    var bx7=0,by7=0,bw7=158,bh7=30;
    if(_gameOver){
      bx7=cx4-bw7/2;by7=by5+36;
      var hov7=_mx>bx7&&_mx<bx7+bw7&&_my>by7&&_my<by7+bh7;
      var sg7=g.createLinearGradient(bx7,by7,bx7+bw7,by7+bh7);
      sg7.addColorStop(0,hov7?'#3a50c8':'#1a2a88');
      sg7.addColorStop(1,hov7?'#5070e8':'#2a40a8');
      fRR(bx7,by7,bw7,bh7,9,'rgba(0,0,0,.25)');
      g.beginPath();g.roundRect(bx7,by7,bw7,bh7,9);g.fillStyle=sg7;g.fill();
      g.strokeStyle='rgba(140,180,255,.55)';g.lineWidth=1;g.beginPath();g.roundRect(bx7,by7,bw7,bh7,9);g.stroke();
      lbl('↺ PLAY FROM BEGINNING',bx7+bw7/2,by7+20,'#d0e8ff',11);
    }
    if(_lastClick.fresh){_lastClick.fresh=false;
      if(_lastClick.x>bx3&&_lastClick.x<bx3+bw3&&_lastClick.y>by3&&_lastClick.y<by3+bh3){
        _lbSaved=false;genStage();state='play';switchToGameMusic();
      }
      if(_lastClick.x>bx4&&_lastClick.x<bx4+bw4&&_lastClick.y>by4&&_lastClick.y<by4+bh4){
        _lbSaved=false;_gameOver=false;_win=false;state='select';switchToIntroMusic();
      }
      if(_lastClick.x>bx5&&_lastClick.x<bx5+bw5&&_lastClick.y>by5&&_lastClick.y<by5+bh5){
        _lbSaved=false;_gameOver=false;_win=false;state='title';switchToIntroMusic();
      }
      if(_win&&_lastClick.x>bx6&&_lastClick.x<bx6+bw6&&_lastClick.y>by6&&_lastClick.y<by6+bh6){
        currentLevel=0;_lbSaved=false;_gameOver=false;_win=false;
        genStage();state='play';switchToGameMusic();
      }
      if(_gameOver&&_lastClick.x>bx7&&_lastClick.x<bx7+bw7&&_lastClick.y>by7&&_lastClick.y<by7+bh7){
        currentLevel=0;_lbSaved=false;_gameOver=false;_win=false;
        genStage();state='play';switchToGameMusic();
      }
    }
  }
  if(_msg&&_msgTimer>0){
    _msgTimer--;
    g.globalAlpha=Math.min(1,_msgTimer/20);
    lbl(_msg,cx4,H/2-60,'#ffccee',15);
    g.globalAlpha=1;
  }
}

// ── UPDATE ───────────────────────────────────────────────────
function update(){
  if(_gameOver||_win)return;
  // Camera: follow the player, keep them ~35% from the left edge
  var targetCam=P.x-W*0.35;
  targetCam=Math.max(0,Math.min(targetCam,WORLD-W));
  cam+=(targetCam-cam)*0.14;  // smooth lerp — fast enough to always keep up

  // Death fall
  if(P.dead){
    P.deathVy+=.5;P.y+=P.deathVy;
    if(P.y>H+80){P.lives--;if(P.lives<=0){_gameOver=true;return;}
      P.x=cam+80;P.y=FLOOR-80;P.vy=0;P.vx=0;P.dead=false;P.invTimer=180;}
    return;
  }

  // Win condition / level / boss
  if(P.x>WORLD-700&&!bossActive&&!bossDefeated)spawnBoss();
  updateBoss();
  if(levelCompleteTimer>0){
    levelCompleteTimer--;
    if(levelCompleteTimer===0){totalShells+=50;_msg="+50 SHELLS!";_msgTimer=120;
      currentLevel++;
      if(currentLevel>=10){currentLevel=10;}// Charizard
      genStage();
    }
  }

  // Powerup timers
  if(P_speed>0)P_speed--;if(P_shield>0)P_shield--;if(P_magnet>0)P_magnet--;if(P_dblBlast>0)P_dblBlast--;
  if(P_dropping>0)P_dropping--;
  // Movement
  var spd=P_speed>0?1.8:1.1;
  var maxSpd=P_speed>0?7:5;
  if(keys['ArrowLeft']||keys['KeyA']){P.vx-=P.onGround?spd:spd*.55;P.dir=-1;}
  if(keys['ArrowRight']||keys['KeyD']){P.vx+=P.onGround?spd:spd*.55;P.dir=1;}
  // Friction when no direction pressed
  var pressingX=(keys['ArrowLeft']||keys['KeyA']||keys['ArrowRight']||keys['KeyD']);
  if(!pressingX)P.vx*=P.onGround?0.72:0.88;
  // Hard clamp
  P.vx=Math.max(-maxSpd,Math.min(maxSpd,P.vx));
  if(Math.abs(P.vx)<0.15)P.vx=0;
  if((keys['ArrowUp']||keys['KeyW']||keys['Space'])&&P.onGround){P.vy=-10;P.onGround=false;}
  if((keys['ArrowDown']||keys['KeyS'])&&P.onGround){P_dropping=18;}// drop through
  if(keys['KeyZ']&&P.blastCd<=0){
    pBlasts.push({x:P.x+P.w/2,y:P.y+P.h*.4,vx:P.dir*11,vy:-1,alive:true,bounces:0,rot:0,traveled:0});
    if(P_dblBlast>0)pBlasts.push({x:P.x+P.w/2,y:P.y+P.h*.4,vx:P.dir*13,vy:-2.5,alive:true,bounces:0,rot:0,traveled:0});
    P.blastCd=18;
    burst(P.x+P.w/2,P.y+P.h*.4,'#ff88cc',4);
  }
  if(keys['KeyX']&&P.specialCd<=0&&P.specialMeter>=100)activateSpecial();
  if(P.specialCd>0)P.specialCd--;

  // Crate collision
  for(var cri=0;cri<crates.length;cri++){
    var cr3=crates[cri];if(!cr3.alive)continue;
    var nextPX=P.x+P.vx;
    if(nextPX+P.w>cr3.x+2&&nextPX<cr3.x+cr3.w-2&&P.y+P.h>cr3.y+4&&P.y<cr3.y+cr3.h){
      P.vx=0;
      if(P.x+P.w<=cr3.x+8)P.x=cr3.x-P.w;
      else if(P.x>=cr3.x+cr3.w-8)P.x=cr3.x+cr3.w;
    }
  }
  // Barricade side push (before velocity applied to x)
  var nxP=barrXPush(P.x+P.vx,P.y,P.w,P.h,P.vx);
  if(nxP!==P.x+P.vx)P.vx=0;
  P.vx*=P.onGround?.78:.9;P.vy=Math.min(P.vy+GR,16);
  P.x=Math.max(cam,P.x+P.vx);
  if(P.x+P.w>cam+W-10)P.x=cam+W-P.w-10;
  P.y+=P.vy;

  P.onGround=false;
  var pp2=landOn(P.x,P.y,P.w,P.h,P.vy,true);
  if(pp2){P.y=pp2.y-P.h;P.vy=0;P.onGround=true;}
  // Land on top of barricades
  if(!P.onGround&&P.vy>=0){
    var bt=barrTopLand(P.x,P.y,P.w,P.h,P.vy);
    if(bt){P.y=bt.y-P.h;P.vy=0;P.onGround=true;}
  }
  // Land on crates
  if(!P.onGround&&P.vy>=0){
    for(var crli=0;crli<crates.length;crli++){
      var crl=crates[crli];if(!crl.alive)continue;
      if(P.x+P.w>crl.x+2&&P.x<crl.x+crl.w-2&&P.y+P.h>=crl.y&&P.y+P.h<=crl.y+P.vy+6){
        P.y=crl.y-P.h;P.vy=0;P.onGround=true;break;
      }
    }
  }
  if(P.y>H+30){P.dead=true;P.deathVy=-8;}
  if(P.invTimer>0)P.invTimer--;
  if(P.blastCd>0)P.blastCd--;
  // Landing squash detection
  if(!_wasOnGround&&P.onGround){_landTimer=9;}
  _wasOnGround=P.onGround;
  if(_landTimer>0)_landTimer--;

  // Blasts
  for(var bi=pBlasts.length-1;bi>=0;bi--){
    var b=pBlasts[bi];if(!b.alive){pBlasts.splice(bi,1);continue;}
    b.x+=b.vx;b.y+=b.vy;b.vy+=.3;b.rot+=.25;b.traveled+=Math.abs(b.vx);
    if(b.y>=FLOOR){b.vy=-(Math.abs(b.vy)*.7+1.5);b.bounces++;if(b.bounces>3||Math.abs(b.vy)<1)b.alive=false;}
    if(b.traveled>900||b.x<cam-400||b.x>cam+W+400)b.alive=false;
    for(var pi4=0;pi4<platforms.length;pi4++){
      var pp3=platforms[pi4];if(pp3.ground)continue;
      if(b.x>pp3.x&&b.x<pp3.x+pp3.w&&b.y>=pp3.y&&b.y<=pp3.y+pp3.h+4&&b.vy>0){
        b.y=pp3.y-1;b.vy=-(Math.abs(b.vy)*.65);b.bounces++;
        if(b.bounces>3)b.alive=false;break;
      }
    }
    // ── Blast ricochets off BARRICADES (indestructible walls) ──
    if(b.alive){
      for(var bri3=0;bri3<barricades.length;bri3++){
        var brr3=barricades[bri3];if(!brr3.alive)continue;
        var bHit=b.x+7>brr3.x&&b.x-7<brr3.x+brr3.w&&b.y+7>brr3.y&&b.y-7<brr3.y+brr3.h;
        if(bHit){
          // Determine entry side: if moving right hit left wall, vice-versa
          var fromLeft=b.vx>0;
          b.vx*=-1;
          // Nudge out of wall
          if(fromLeft)b.x=brr3.x-8;else b.x=brr3.x+brr3.w+8;
          b.bounces++;burst(brr3.x+brr3.w/2,b.y,'#ffccee',3);
          if(b.bounces>6)b.alive=false;
          break;
        }
      }
    }
    // Blast hits crates
    if(b.alive){
      for(var bci=0;bci<crates.length;bci++){
        var cr2=crates[bci];if(!cr2.alive)continue;
        if(b.x>cr2.x&&b.x<cr2.x+cr2.w&&b.y>cr2.y&&b.y<cr2.y+cr2.h){
          cr2.hp--;b.alive=false;
          burst(cr2.x+cr2.w/2,cr2.y,'#f0c890',6);
          if(cr2.hp<=0){cr2.alive=false;
            hearts.push({x:cr2.x+cr2.w/2,y:cr2.y,alive:true,bob:0});
            P.score+=25;_msg='📦 +25!';_msgTimer=35;
          }
        }
      }
    }
    // Blast hits boss
    if(b.alive&&BOSS.alive&&!BOSS.dead){
      if(Math.abs(b.x-(BOSS.x+BOSS.w/2))<BOSS.w/2+10&&Math.abs(b.y-(BOSS.y+BOSS.h/2))<BOSS.h/2+12){
        BOSS.hp--;BOSS.hitTimer=16;b.alive=false;P.specialMeter=Math.min(100,P.specialMeter+6);
        burst(BOSS.x+BOSS.w/2,BOSS.y,'#ff88cc',6);
        if(BOSS.hp<=0){BOSS.dead=true;burst(BOSS.x+BOSS.w/2,BOSS.y,'#ffccee',20);}
      }
    }
    // Hit enemies
    for(var ei4=0;ei4<enemies.length;ei4++){
      var e3=enemies[ei4];if(!e3.alive||!b.alive)continue;
      if(Math.abs(b.x-(e3.x+e3.w/2))<e3.w/2+8&&Math.abs(b.y-(e3.y+e3.h/2))<e3.h/2+8){
        e3.hp--;e3.hitTimer=14;b.alive=false;
        burst(e3.x+e3.w/2,e3.y,'#ff88cc',5);
        if(e3.hp<=0){e3.alive=false;P.score+=e3.pts;
          P.specialMeter=Math.min(100,P.specialMeter+10);// 10 kills = full
          burst(e3.x+e3.w/2,e3.y,'#ffbbdd',8);}
      }
    }
  }

  // Collectibles
  for(var hci=hearts.length-1;hci>=0;hci--){
    var hc=hearts[hci];if(!hc.alive)continue;
    if(Math.abs(hc.x-P.x-P.w/2)<20&&Math.abs(hc.y-P.y-P.h/2)<24){
      hc.alive=false;P.score+=10;totalShells++;
      burst(hc.x,hc.y,'#e8c490',5);
    }
  }
  for(var gci=gems.length-1;gci>=0;gci--){
    var gc=gems[gci];if(!gc.alive)continue;
    if(Math.abs(gc.x-P.x-P.w/2)<20&&Math.abs(gc.y-P.y-P.h/2)<24){
      gc.alive=false;P.score+=50;totalShells++;
      _msg='✨ +50!';_msgTimer=40;burst(gc.x,gc.y,'#ffccff',7);
    }
  }
  // Powerup pickups
  for(var pup=powerups.length-1;pup>=0;pup--){
    var pu2=powerups[pup];if(!pu2.alive)continue;
    if(Math.abs(pu2.x-P.x-P.w/2)<28&&Math.abs(pu2.y-P.y-P.h/2)<32){
      pu2.alive=false;
      if(pu2.label==='speed'){P_speed=280;_msg='⚡ SPEED UP!';}
      else if(pu2.label==='shield'){P_shield=300;P.invTimer=300;_msg='🛡 SHIELDED!';}
      else if(pu2.label==='magnet'){P_magnet=400;_msg='🧲 MAGNET!';}
      else if(pu2.label==='dblBlast'){P_dblBlast=350;_msg='💕 DOUBLE BLAST!';}
      else if(pu2.label==='life'){P.lives=Math.min(P.lives+1,8);_msg='❤ +1 LIFE!';}
      _msgTimer=70;
      burst(pu2.x,pu2.y,pu2.col,10);
    }
  }
  // Magnet pulls hearts/gems
  if(P_magnet>0){
    hearts.forEach(function(h){if(!h.alive)return;
      var dx=P.x+P.w/2-h.x,dy=P.y+P.h/2-h.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<200){h.x+=dx/dist*5;h.y+=dy/dist*5;}
    });
    gems.forEach(function(gm){if(!gm.alive)return;
      var dx=P.x+P.w/2-gm.x,dy=P.y+P.h/2-gm.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<200){gm.x+=dx/dist*5;gm.y+=dy/dist*5;}
    });
  }

  // Enemies
  for(var ei5=0;ei5<enemies.length;ei5++){
    var e4=enemies[ei5];if(!e4.alive)continue;
    if(Math.abs(e4.x-(cam+W/2))>W+80)continue;
    if(e4.hitTimer>0){e4.hitTimer--;}
    // hopper: jump periodically
    if(e4.type==='hopper'&&e4.onGround&&tick%ri(55,85)===0){e4.vy=-11;}
    // ── Barricade solid wall collision (enemies) ────────
    var enNext=e4.x+e4.vx;
    var enHit=false;
    for(var bri=0;bri<barricades.length;bri++){
      var brr=barricades[bri];if(!brr.alive)continue;
      // Future-position side check
      if(enNext+e4.w>brr.x+1&&enNext<brr.x+brr.w-1&&e4.y+e4.h>brr.y+4&&e4.y<brr.y+brr.h){
        e4.vx*=-1;e4.dir*=-1;enNext=e4.x;enHit=true;break;
      }
    }
    e4.x=enNext;
    // Push out if already overlapping a barricade
    for(var bri2=0;bri2<barricades.length;bri2++){
      var brr2=barricades[bri2];if(!brr2.alive)continue;
      if(e4.x+e4.w>brr2.x+1&&e4.x<brr2.x+brr2.w-1&&e4.y+e4.h>brr2.y+4&&e4.y<brr2.y+brr2.h){
        if(e4.x+e4.w/2<brr2.x+brr2.w/2){e4.x=brr2.x-e4.w;}else{e4.x=brr2.x+brr2.w;}
        e4.vx*=-1;e4.dir*=-1;break;
      }
    }e4.vy=Math.min(e4.vy+GR,14);e4.y+=e4.vy;
    e4.onGround=false;
    var ep2=landOn(e4.x,e4.y,e4.w,e4.h,e4.vy);
    if(ep2){e4.y=ep2.y-e4.h;e4.vy=0;e4.onGround=true;}
    // Land on barricade top
    if(!e4.onGround&&e4.vy>=0){
      var ebt=barrTopLand(e4.x,e4.y,e4.w,e4.h,e4.vy);
      if(ebt){e4.y=ebt.y-e4.h;e4.vy=0;e4.onGround=true;}
    }
    if(e4.y>H+50)e4.y=FLOOR-e4.h;
    if(e4.x<cam-60||e4.x>cam+W+60){e4.vx*=-1;e4.dir*=-1;}
    if(P.invTimer>0)continue;
    var dx3=P.x+P.w/2-(e4.x+e4.w/2),dy3=P.y+P.h-(e4.y+e4.h*.5);
    if(Math.abs(dx3)<e4.w/2+12&&Math.abs(dy3)<e4.h/2+18){
      if(P.vy>0&&P.y+P.h<e4.y+e4.h*.4){
        e4.hp--;P.vy=-10;burst(e4.x+e4.w/2,e4.y,'#ff88cc',5);
        if(e4.hp<=0){e4.alive=false;P.score+=e4.pts;
          P.specialMeter=Math.min(100,P.specialMeter+10);// 10 kills = full
          burst(e4.x+e4.w/2,e4.y,'#ffbbdd',8);}
      } else {
        P.invTimer=120;P.vy=-6;P.vx=dx3>0?-4:4;
        P.lives--;burst(P.x+P.w/2,P.y,'#ff6699',4);
        if(P.lives<=0){_gameOver=true;}
      }
    }
  }

  // Particles
  for(var pi5=gParticles.length-1;pi5>=0;pi5--){
    var par=gParticles[pi5];par.x+=par.vx;par.y+=par.vy;par.vy+=.18;par.life++;
    if(par.life>=par.max)gParticles.splice(pi5,1);
  }
}

// ── SPAWN BOSS ────────────────────────────────────────────────
function spawnBoss(){
  if(bossActive)return;
  var lv=currentLevel<=9?LEVELS[currentLevel]:null;
  BOSS.x=WORLD-680;BOSS.y=FLOOR-120;BOSS.vx=2;BOSS.vy=0;
  BOSS.hp=lv?lv.bossHp:50;BOSS.maxHp=BOSS.hp;
  BOSS.alive=true;BOSS.dead=false;BOSS.deathTimer=0;
  BOSS.hitTimer=0;BOSS.timer=0;BOSS.dir=-1;BOSS.phase2=false;BOSS.projs=[];
  bossActive=true;bossDefeated=false;
  _msg='⚡ '+(lv?lv.boss:'CHARIZARD')+' APPEARS!';_msgTimer=100;
}

// ── UPDATE BOSS ───────────────────────────────────────────────
function updateBoss(){
  if(!BOSS.alive)return;
  if(BOSS.dead){
    BOSS.deathTimer++;
    if(BOSS.deathTimer>80){
      BOSS.alive=false;bossDefeated=true;
      if(currentLevel<10){
        levelCompleteTimer=200;
        _msg=currentLevel<9?'✨ LEVEL COMPLETE! ✨':'🏆 ALL LEVELS DONE! FINAL BOSS!';
        _msgTimer=200;
        P.score+=500+currentLevel*100;
      } else {
        _win=true;_msg='🔥 YOU DEFEATED CHARIZARD! 🔥';_msgTimer=999;
      }
    }
    return;
  }
  BOSS.phase2=BOSS.hp<=BOSS.maxHp/2;
  BOSS.timer++;
  var spd=BOSS.phase2?2.8:1.8;
  BOSS.x+=BOSS.vx*(BOSS.phase2?1.5:1);
  BOSS.vy=Math.min(BOSS.vy+GR,14);BOSS.y+=BOSS.vy;
  var bp2=landOn(BOSS.x,BOSS.y,BOSS.w,BOSS.h,BOSS.vy);
  if(bp2){BOSS.y=bp2.y-BOSS.h;BOSS.vy=0;}
  if(BOSS.y>H+40){BOSS.y=FLOOR-BOSS.h;BOSS.vy=0;}
  var BX=WORLD-680;
  if(BOSS.x<BX-260){BOSS.vx=Math.abs(BOSS.vx);BOSS.dir=1;}
  if(BOSS.x>BX+200){BOSS.vx=-Math.abs(BOSS.vx);BOSS.dir=-1;}
  if(BOSS.hitTimer>0)BOSS.hitTimer--;
  // Jump towards player
  if(BOSS.timer%120===0&&Math.abs(P.x-(BOSS.x+BOSS.w/2))<360){
    BOSS.vy=BOSS.phase2?-16:-12;
  }
  // Shoot projectiles
  var shootInterval=BOSS.phase2?40:70;
  if(BOSS.timer%shootInterval===0){
    var bd=P.x<BOSS.x?-1:1;
    BOSS.projs.push({x:BOSS.x+BOSS.w/2,y:BOSS.y+BOSS.h*.3,vx:bd*(currentLevel>=10?7:5),vy:-3,alive:true});
    if(BOSS.phase2)BOSS.projs.push({x:BOSS.x+BOSS.w/2,y:BOSS.y+BOSS.h*.3,vx:bd*6,vy:-6,alive:true});
  }
  // Update projectiles
  for(var bpi=BOSS.projs.length-1;bpi>=0;bpi--){
    var bp3=BOSS.projs[bpi];bp3.x+=bp3.vx;bp3.y+=bp3.vy;bp3.vy+=.35;
    if(bp3.y>FLOOR||bp3.x<cam-200||bp3.x>cam+W+200){BOSS.projs.splice(bpi,1);continue;}
    if(P.invTimer<=0&&Math.abs(bp3.x-(P.x+P.w/2))<22&&Math.abs(bp3.y-(P.y+P.h/2))<22){
      BOSS.projs.splice(bpi,1);P.invTimer=110;P.vy=-5;P.vx=bp3.vx>0?-4:4;
      if(P_shield<=0){P.lives--;burst(P.x+P.w/2,P.y,'#ff6699',4);if(P.lives<=0)_gameOver=true;}
    }
  }
  // Stomp

  if(state==='store'){drawStore();return;}
  if(state==='leaderboard'){drawLeaderboard();return;}

  });

  }
  drawSpecialFX();

  // Level complete banner + PINKY UP DANCE
  if(levelCompleteTimer>0){
    var danceT=200-levelCompleteTimer; // 0→200 elapsed

    (function(){
      var cx=W/2,cy=H/2+90;
      var bounce=Math.sin(danceT*.18)*7;
      var sway=Math.sin(danceT*.09)*10;
      var shimmy=Math.sin(danceT*.22)*5;
      var bx=cx+sway,by=cy+bounce;
      var armRaise=Math.min(1,danceT/25);
      // arm angles (no -- operator, plain arithmetic)
      var liftL=(-Math.PI)*0.55 - Math.sin(danceT*.13)*0.08;
      var liftR=(-Math.PI)*0.45 + Math.sin(danceT*.13+1)*0.08;
      // Spotlight
      var spot=g.createRadialGradient(cx,cy,0,cx,cy,110);

      ['♪','♫','♥','✨'].forEach(function(note,ni){
        var ny=cy-50-((danceT*1.1+ni*40)%80);
        var nx=cx+Math.cos(danceT*.04+ni*1.57)*55;
        g.globalAlpha=(1-((danceT*1.1+ni*40)%80)/80)*fade;
        g.font='13px serif';g.textAlign='center';
        g.fillStyle=['#ffcc44','#ff88cc','#88eecc','#ffaadd'][ni];
        g.fillText(note,nx,ny);
      });
      g.globalAlpha=fade;
      // Dress
      g.fillStyle='#ff70c0';
      g.beginPath();
      g.moveTo(bx-8,by-18);
      g.bezierCurveTo(bx-22+shimmy,by+8,bx-28+shimmy,by+28,bx-26+shimmy,by+38);
      g.lineTo(bx+26-shimmy,by+38);
      g.bezierCurveTo(bx+28-shimmy,by+28,bx+22-shimmy,by+8,bx+8,by-18);
      g.closePath();g.fill();
      // Torso

      g.fillRect(bx-9,by-38,18,22);
      // Head
      g.fillStyle='#f8cfa8';
      g.beginPath();g.arc(bx,by-52,16,0,6.28);g.fill();
      // Hair
      g.fillStyle='#28100a';
      g.beginPath();g.arc(bx,by-58,14,Math.PI,0);g.fill();
      g.beginPath();g.arc(bx+8,by-56,8,-0.2,Math.PI*0.9);g.fill();
      // Ponytail
      g.beginPath();
      g.moveTo(bx-4,by-62);
      g.bezierCurveTo(bx-16,by-70+Math.sin(danceT*.14)*6,
                      bx-22+Math.sin(danceT*.11)*8,by-50,

      g.lineTo(bx-12,by-48);
      g.bezierCurveTo(bx-14,by-56,bx-8,by-62,bx-4,by-62);
      g.closePath();g.fill();
      // Eyes

        g.beginPath();g.arc(bx-5,by-53,2.5,0,6.28);g.fill();

        g.beginPath();g.moveTo(bx+3,by-53);g.lineTo(bx+7,by-53);g.stroke();
      }

      g.beginPath();g.ellipse(bx-8,by-49,4,2.5,0,0,6.28);g.fill();
      g.beginPath();g.ellipse(bx+8,by-49,4,2.5,0,0,6.28);g.fill();
      // Arms — upper
      g.strokeStyle='#f8cfa8';g.lineWidth=6;g.lineCap='round';
      var la1x=bx-10,la1y=by-32;
      var la2x=la1x + Math.cos(liftL)*22*armRaise + (1-armRaise)*(0-16);
      var la2y=la1y + Math.sin(liftL)*22*armRaise + (1-armRaise)*10;
      g.beginPath();g.moveTo(la1x,la1y);g.lineTo(la2x,la2y);g.stroke();
      // Forearm L
      var la3x=la2x + Math.cos(liftL+0.9)*16*armRaise;
      var la3y=la2y + Math.sin(liftL+0.9)*16*armRaise + (1-armRaise)*10;
      g.lineWidth=5;
      g.beginPath();g.moveTo(la2x,la2y);g.lineTo(la3x,la3y);g.stroke();
      // Fist L
      g.fillStyle='#f8cfa8';
      g.beginPath();g.arc(la3x,la3y,4.5,0,6.28);g.fill();
      // Pinky L
      g.strokeStyle='#f8cfa8';g.lineWidth=2.2;g.lineCap='round';
      g.beginPath();g.moveTo(la3x-1.5,la3y-4);g.lineTo(la3x-3,la3y-14*armRaise);g.stroke();
      // Upper arm R
      g.strokeStyle='#f8cfa8';g.lineWidth=6;
      var ra1x=bx+10,ra1y=by-32;
      var ra2x=ra1x + Math.cos(liftR)*22*armRaise + (1-armRaise)*16;
      var ra2y=ra1y + Math.sin(liftR)*22*armRaise + (1-armRaise)*10;
      g.beginPath();g.moveTo(ra1x,ra1y);g.lineTo(ra2x,ra2y);g.stroke();
      // Forearm R
      var ra3x=ra2x + Math.cos(liftR-0.9)*16*armRaise;
      var ra3y=ra2y + Math.sin(liftR-0.9)*16*armRaise + (1-armRaise)*10;
      g.lineWidth=5;
      g.beginPath();g.moveTo(ra2x,ra2y);g.lineTo(ra3x,ra3y);g.stroke();
      // Fist R
      g.fillStyle='#f8cfa8';
      g.beginPath();g.arc(ra3x,ra3y,4.5,0,6.28);g.fill();
      // Pinky R
      g.strokeStyle='#f8cfa8';g.lineWidth=2.2;g.lineCap='round';
      g.beginPath();g.moveTo(ra3x+1.5,ra3y-4);g.lineTo(ra3x+3,ra3y-14*armRaise);g.stroke();
      // Legs
      var stepL=Math.sin(danceT*.18)*12;
      var stepR=0-Math.sin(danceT*.18)*12;
      g.strokeStyle='#ff70c0';g.lineWidth=7;g.lineCap='round';
      g.beginPath();g.moveTo(bx-5,by+36);g.lineTo(bx-5+stepL*0.3,by+52);g.stroke();
      g.lineWidth=5;
      g.beginPath();g.moveTo(bx-5+stepL*0.3,by+52);g.lineTo(bx-5+stepL*0.5,by+64);g.stroke();
      g.beginPath();g.moveTo(bx+5,by+36);g.lineTo(bx+5+stepR*0.3,by+52);g.stroke();
      g.beginPath();g.moveTo(bx+5+stepR*0.3,by+52);g.lineTo(bx+5+stepR*0.5,by+64);g.stroke();
      // Shoes
      g.fillStyle='#ffffff';
      g.beginPath();g.ellipse(bx-5+stepL*0.5,by+66,8,4,0.2,0,6.28);g.fill();
      g.beginPath();g.ellipse(bx+5+stepR*0.5,by+66,8,4,-0.2,0,6.28);g.fill();
      // Sparkles at pinky tips
      var tips=[[la3x-3,la3y-14*armRaise],[ra3x+3,ra3y-14*armRaise]];
      tips.forEach(function(pt){
        for(var spi=0;spi<5;spi++){
          var spa=spi/5*6.28+danceT*.12;
          var spr=6+Math.sin(danceT*.2+spi)*3;
          g.fillStyle=['#ffcc44','#ff88dd','#88ddff','#ffddaa','#ff66cc'][spi];
          g.globalAlpha=(0.6+Math.sin(danceT*.15+spi)*0.3)*fade;
          g.beginPath();
          g.arc(pt[0]+Math.cos(spa)*spr,pt[1]+Math.sin(spa)*spr,1.8,0,6.28);
          g.fill();
        }
      });
      g.globalAlpha=1;g.textAlign='left';
    })();
  }
  drawOverlay();
  if(state==='play')update();
}

document.addEventListener('keydown',function(e){
  if(state==='title'&&(e.code==='Space'||e.code==='Enter')){state='select';}
  if(state==='play'&&(e.code==='KeyP'||e.code==='Escape')){
    _paused=!_paused;
    if(!_paused&&_pauseTempChar>=0){selectedChar=_pauseTempChar;_pauseTempChar=-1;}
    return;
  }
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
});

cv.addEventListener('mousemove',function(e){
  var p=cvCoords(e.clientX,e.clientY);_mx=p.x;_my=p.y;
  if(state==='select'){selHover=-1;_scCards.forEach(function(c,i){if(c&&_mx>c.x&&_mx<c.x+c.w&&_my>c.y&&_my<c.y+c.h)selHover=i;});}
  if(_paused){
    var cardW3=62,cols3=Math.max(3,Math.floor((W-40)/68)),gapX3=Math.floor((W-40-cols3*cardW3)/(cols3+1));
    var fy2=74+_pauseScroll,fi4=0;_pauseSelHover=-1;
    SECTIONS.forEach(function(sec3){
      fy2+=22;var rows3=Math.ceil(sec3.chars.length/cols3);
      for(var ri5=0;ri5<rows3;ri5++){
        for(var ci5=0;ci5<cols3;ci5++){
          var idx5=ri5*cols3+ci5;if(idx5>=sec3.chars.length)break;
          var cx5=20+gapX3+(ci5*(cardW3+gapX3)),cy5=fy2;
          if(_mx>cx5&&_mx<cx5+cardW3&&_my>cy5&&_my<cy5+66)_pauseSelHover=fi4+idx5;
        }fy2+=66+5;
      }fi4+=sec3.chars.length;fy2+=4;
    });

});
cv.addEventListener('click',function(e){
  var p=cvCoords(e.clientX,e.clientY);
  _lastClick={x:p.x,y:p.y,fresh:true};
  if(state==='title'){
    if(p.x>_btnX&&p.x<_btnX+_btnW&&p.y>_btnY&&p.y<_btnY+_btnH){state='select';}
    if(p.x>_titleStoreBx&&p.x<_titleStoreBx+_titleStoreBw&&p.y>_titleStoreBy&&p.y<_titleStoreBy+_titleStoreBh){state='store';}
    if(p.x>_titleLbBx&&p.x<_titleLbBx+_titleLbBw&&p.y>_titleLbBy&&p.y<_titleLbBy+_titleLbBh){state='leaderboard';}
    if(p.x>_titleUnBx&&p.x<_titleUnBx+_titleUnBw&&p.y>_titleUnBy&&p.y<_titleUnBy+_titleUnBh){
      _unEntry=_username;_unCapture=true;state='username';
      var _ui=document.getElementById('un-input');
      _ui.value=_username||'';_ui.style.display='block';setTimeout(function(){_ui.focus();_ui.select();},60);
    }
    if(p.x>_titleAccBx&&p.x<_titleAccBx+_titleAccBw&&p.y>_titleAccBy&&p.y<_titleAccBy+_titleAccBh){state='accshop';}
  }
  if(state==='select')handleSelectClick(p.x,p.y);
  if(state==='username'){
    var _ui2=document.getElementById('un-input');
    var _uiVal=_ui2?_ui2.value:_unEntry;
    if(p.x>_unSaveBx&&p.x<_unSaveBx+_unSaveBw&&p.y>_unSaveBy&&p.y<_unSaveBy+_unSaveBh){
      if(_uiVal.trim()){_username=_uiVal.trim().substring(0,16);_saveUser();}
      if(_ui2)_ui2.style.display='none';
      _unCapture=false;state='title';
    }
    if(p.x>_unBackBx&&p.x<_unBackBx+_unBackBw&&p.y>_unBackBy&&p.y<_unBackBy+_unBackBh){
      if(_ui2)_ui2.style.display='none';
      _unCapture=false;state='title';
    }
  }
  if(state==='store'){
    if(p.x>_storeBBx&&p.x<_storeBBx+_storeBBw&&p.y>_storeBBy&&p.y<_storeBBy+_storeBBh){state='title';}
    _storeItems.forEach(function(item){
      if(item._ix!==undefined&&p.x>item._ix&&p.x<item._ix+item._iw&&p.y>item._iy&&p.y<item._iy+50){
        if(totalShells>=item.cost){totalShells-=item.cost;item.fn();
          _storeMsg='Got '+item.name+'!';_storeMsgTimer=60;
        }else{_storeMsg='Need more shells!';_storeMsgTimer=60;}
      }
    });
  }
  if(state==='leaderboard'){
    if(p.x>_lbBBx&&p.x<_lbBBx+_lbBBw&&p.y>_lbBBy&&p.y<_lbBBy+_lbBBh){state='title';}
    _lbTabs.forEach(function(t,i){
      if(t&&p.x>t.x&&p.x<t.x+t.w&&p.y>t.y&&p.y<t.y+t.h)_lbTab=i;
    });
  }
  if(state==='accshop'){
    if(p.x>_accBBx&&p.x<_accBBx+_accBBw&&p.y>_accBBy&&p.y<_accBBy+_accBBh){state='title';}
    _accTabRects.forEach(function(t){if(p.x>t.x&&p.x<t.x+t.w&&p.y>t.y&&p.y<t.y+t.h)_accTab=t.i;});
    _accItemRects.forEach(function(r){
      if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h){
        var item=r.item;
        if(accOwned(item.id)){
          _equippedAcc=(_equippedAcc===item.id)?null:item.id;
          _saveAcc();_accMsg=_equippedAcc?'Equipped '+item.name+'!':'Unequipped.';_accMsgT=50;
        } else if(totalShells>=item.cost){
          totalShells-=item.cost;_ownedAcc.push(item.id);_equippedAcc=item.id;
          _saveAcc();_accMsg='Got '+item.name+'!';_accMsgT=60;
        } else {_accMsg='Need more shells!';_accMsgT=50;}
      }
    });
  }
  // Pause button hit
  if(state==='play'&&!_paused&&p.x>W-52&&p.x<W-4&&p.y>4&&p.y<36){
    _paused=true;_pauseTempChar=selectedChar;
  }
  if(_paused){
    // Character card clicks
    var cardW2=62,cols2=Math.max(3,Math.floor((W-40)/68));
    var gapX2=Math.floor((W-40-cols2*cardW2)/(cols2+1));
    var fy=74+_pauseScroll,fi3=0;
    SECTIONS.forEach(function(sec2){
      fy+=22;
      var rows2=Math.ceil(sec2.chars.length/cols2);
      for(var ri4=0;ri4<rows2;ri4++){
        for(var ci4=0;ci4<cols2;ci4++){
          var idx4=ri4*cols2+ci4;if(idx4>=sec2.chars.length)break;
          var cx4=20+gapX2+(ci4*(cardW2+gapX2)),cy4=fy;
          if(p.x>cx4&&p.x<cx4+cardW2&&p.y>cy4&&p.y<cy4+66){_pauseTempChar=fi3+idx4;}
        }fy+=66+5;
      }fi3+=sec2.chars.length;fy+=4;
    });
    // Resume / Menu buttons
    var bw6=130,gap6=16;
    if(p.x>W/2-bw6-gap6/2&&p.x<W/2-gap6/2&&p.y>H-54&&p.y<H-18){
      _paused=false;if(_pauseTempChar>=0){selectedChar=_pauseTempChar;_pauseTempChar=-1;}
    }
    if(p.x>W/2+gap6/2&&p.x<W/2+gap6/2+bw6&&p.y>H-54&&p.y<H-18){
      _paused=false;currentLevel=0;state='select';switchToIntroMusic();
    }
  }
});

},{passive:true});

},{passive:false});
// Touch button → keys
(function(){
  var map={'b-left':'ArrowLeft','b-right':'ArrowRight',
           'b-up':'ArrowUp','b-down':'ArrowDown',
           'b-blast':'KeyZ','b-special':'KeyX'};
  Object.keys(map).forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    var k=map[id];
    el.addEventListener('touchstart',function(ev){ev.preventDefault();keys[k]=true;},{passive:false});
    el.addEventListener('touchend',function(ev){ev.preventDefault();keys[k]=false;},{passive:false});
    el.addEventListener('mousedown',function(){keys[k]=true;});
    el.addEventListener('mouseup',function(){keys[k]=false;});
  });
  // Diagonal buttons — each sets two keys
  var diag={
    'b-ul':['ArrowUp','ArrowLeft'],
    'b-ur':['ArrowUp','ArrowRight'],
    'b-dl':['ArrowDown','ArrowLeft'],
    'b-dr':['ArrowDown','ArrowRight']
  };
  Object.keys(diag).forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    var ks=diag[id];
    el.addEventListener('touchstart',function(ev){ev.preventDefault();ks.forEach(function(k){keys[k]=true;});},{passive:false});
    el.addEventListener('touchend',function(ev){ev.preventDefault();ks.forEach(function(k){keys[k]=false;});},{passive:false});
    el.addEventListener('mousedown',function(){ks.forEach(function(k){keys[k]=true;});});
    el.addEventListener('mouseup',function(){ks.forEach(function(k){keys[k]=false;});});
  });
})();

(function(){
  var btn=document.getElementById('pausebtn');
  var icon=document.getElementById('pauseIcon');
  var label=document.getElementById('pauseLabel');
  if(!btn)return;
  function togglePause(e){
    e.preventDefault();
    if(state!=='play')return;
    _paused=!_paused;
    if(!_paused&&_pauseTempChar>=0){selectedChar=_pauseTempChar;_pauseTempChar=-1;}
    icon.textContent=_paused?'▶':'⏸';
    label.textContent=_paused?'PLAY':'PAUSE';
    btn.style.background=_paused?'rgba(60,180,80,.6)':'rgba(140,50,90,.55)';
    btn.style.borderColor=_paused?'rgba(100,255,140,.7)':'rgba(255,150,200,.7)';
  }
  btn.addEventListener('touchstart',togglePause,{passive:false});
  btn.addEventListener('click',togglePause);
  // Keep icon in sync when paused from keyboard
  setInterval(function(){
    if(state!=='play'){icon.textContent='⏸';label.textContent='PAUSE';
      btn.style.background='rgba(140,50,90,.55)';btn.style.borderColor='rgba(255,150,200,.7)';return;}
    var shouldBePaused=_paused;
    icon.textContent=shouldBePaused?'▶':'⏸';
    label.textContent=shouldBePaused?'PLAY':'PAUSE';
    btn.style.background=shouldBePaused?'rgba(60,180,80,.6)':'rgba(140,50,90,.55)';
    btn.style.borderColor=shouldBePaused?'rgba(100,255,140,.7)':'rgba(255,150,200,.7)';
  },200);
})();
(function(){
  var ui=document.getElementById('un-input');
  if(!ui)return;
  // Sync typed value into _unEntry every keystroke
  ui.addEventListener('input',function(){_unEntry=ui.value;});
  // Enter key = save and close
  ui.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.code==='Enter'){
      e.preventDefault();
      if(ui.value.trim()){_username=ui.value.trim().substring(0,16);_saveUser();}
      ui.style.display='none';_unCapture=false;state='title';
    }
    if(e.code==='Escape'){ui.style.display='none';_unCapture=false;state='title';}
    e.stopPropagation(); // don't let game hear these keys
  });
})();
